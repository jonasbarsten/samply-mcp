<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table</title>
  <style>
    /* Declared, so a dark host keeps the frame transparent instead of painting it white under light text. */
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; color: #222; background: transparent; }
    .title { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ddd; vertical-align: middle; }
    th { font-weight: 600; white-space: nowrap; }
    th.num, td.num { text-align: right; white-space: nowrap; }
    td.actions { white-space: nowrap; }
    td.actions button { margin-right: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid #1f6feb; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
    td.actions button:last-child { margin-right: 0; }
    td.actions button[disabled] { opacity: 0.5; cursor: default; }
    .note { margin: 10px 0 0; font-size: 13px; color: #666; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; }
      th, td { border-bottom-color: #444; }
      td.actions button { border-color: #7cb0ff; }
      .note { color: #bbb; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Each inlined bundle gets its own module scope; module scripts run in order. -->
  <script type="module">/*__BUNDLE__*/</script>
  <script type="module">/*__LOGIC__*/</script>
  <script type="module">
    const { App } = globalThis.__mcpApps;
    const { renderTable } = globalThis.__widget;
    const app = new App({ name: "Samply table", version: "1.0.0" });
    const root = document.getElementById("root");
    const syncSize = () => app.sendSizeChanged({ height: document.body.scrollHeight }).catch(() => {});
    // Several rows can be acted on, so the page is not frozen after one click. It remembers which rows were acted on
    // instead, so a replayed tool result for the same table cannot re-enable them. A different table starts fresh.
    let shown = null;
    let acted = new Set();
    app.ontoolresult = (params) => {
      const sc = params.structuredContent;
      if (!sc?.title || !Array.isArray(sc.columns) || !Array.isArray(sc.rows)) return;
      const key = JSON.stringify(sc);
      if (key !== shown) {
        shown = key;
        acted = new Set();
      }
      root.replaceChildren();
      renderTable(document, root, sc, (text) => {
        app.sendMessage({ role: "user", content: [{ type: "text", text }] }).catch((e) => console.error("sendMessage failed", e));
      }, acted);
      syncSize();
    };
    await app.connect();
  </script>
</body>
</html>
